# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches:
    - master
    - "*.x"
  # No branch filter: `branches` here filters on the PR's base, so a stacked PR
  # whose base is a feature branch would get no CI at all until the branch under
  # it merged. `push` keeps its filter so feature-branch pushes do not double-build.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PARENT_BRANCH: main
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Checkout fess-parent
      uses: actions/checkout@v4
      with:
        repository: codelibs/fess-parent
        ref: ${{ env.PARENT_BRANCH }}
        path: fess-parent
    - name: Install fess-parent
      run: |
        cd fess-parent
        mvn install -Dgpg.skip=true
    - name: Check formatting
      run: mvn -B formatter:validate --file pom.xml
    - name: Build with Maven
      run: mvn -B verify --file pom.xml
